# Revisión automática de NONA Studio Academy.
# Copia este archivo en .github/workflows/revisar.yml de tu repositorio.
# En cada push a la carpeta ejercicios/, corre las pruebas de cada ejercicio con Godot
# y guarda el resultado en resultados/<ejercicio>.json, que es lo que lee el botón «Revisar».
name: Revisión automática

on:
  push:
    paths:
      - "ejercicios/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar Godot 4.7.2
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Correr las pruebas de cada ejercicio
        run: |
          mkdir -p resultados
          for d in ejercicios/*/; do
            n=$(basename "$d")
            [ -f "$d/tests/correr.gd" ] || continue
            rm -f "resultados/$n.json"
            ./godot --headless --path "$d" --import > /dev/null 2>&1 || true
            timeout 180 ./godot --headless --path "$d" --script res://tests/correr.gd -- --salida "$PWD/resultados/$n.json" --commit "$GITHUB_SHA" || true
            if [ ! -f "resultados/$n.json" ]; then
              printf '{"clase":"%s","commit":"%s","aprobado":false,"aprobadas":0,"total":1,"pruebas":[{"nombre":"El proyecto se ejecuta","ok":false,"mensaje":"Godot no pudo correr el ejercicio. Abre el proyecto en Godot y revisa que no tenga errores."}]}' "$n" "$GITHUB_SHA" > "resultados/$n.json"
            fi
          done

      - name: Guardar los resultados
        run: |
          rm -f godot godot.zip
          git config user.name "Revisión automática"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados
          git diff --cached --quiet && exit 0
          git commit -m "Resultados de la revisión automática [skip ci]"
          git pull --rebase
          git push
